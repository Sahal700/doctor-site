<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tele-Psychiatric Consent Form</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f97316;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 12px 40px;
    }
    .page {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p.lead { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 16px;
      align-items: center;
    }
    .bar a, .bar button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .bar a:hover, .bar button:hover { border-color: var(--accent); color: #c2410c; }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      letter-spacing: 0.2px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
    }
    textarea { resize: vertical; min-height: 80px; grid-column: 1 / -1; }
    .actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .actions button {
      flex: 1 1 180px;
      border: none;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-weight: 700;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.28);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }
    .actions button:hover { transform: translateY(-1px); }
    .actions button:active { transform: translateY(0); box-shadow: none; }
    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    .consent-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text);
      margin: 12px 2px 8px;
      width: 100%;
    }
    .consent-row input { margin: 0; }
    .consent-row a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .consent-row a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .page { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Tele-Psychiatric Consent Form</h1>
    <p class="lead">
      Complete the details below, review the booking & cancellation policy, and your request will open in WhatsApp with your consent message included.
    </p>

    <form id="consent-form">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Full name" required />
      </div>
      <div>
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="1" max="120" placeholder="Age" />
      </div>
      <div>
        <label for="gender">Gender</label>
        <input id="gender" name="gender" type="text" placeholder="Gender" />
      </div>
      <div>
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" placeholder="Phone number" required />
      </div>
      <div>
        <label for="marital">Marital Status</label>
        <input id="marital" name="marital" type="text" placeholder="Single / Married / Other" />
      </div>
      <div>
        <label for="father">Father Name</label>
        <input id="father" name="father" type="text" placeholder="Father's name" />
      </div>
      <div style="grid-column: 1 / -1;">
        <label for="address">Address</label>
        <textarea id="address" name="address" placeholder="Street, city, state, postal code"></textarea>
      </div>
      <div>
        <label for="education">Education Qualification</label>
        <input id="education" name="education" type="text" placeholder="Highest qualification" />
      </div>
      <div>
        <label for="family">Family Type</label>
        <input id="family" name="family" type="text" placeholder="Nuclear / Joint" />
      </div>

      <label class="consent-row">
        <input type="checkbox" id="consent-agree" />
        <span>
          I have read and agree to the
          <a href="policy.html" target="_blank" rel="noopener" style="color: rgb(0, 94, 255); text-decoration: underline;">Terms and Conditions.</a>
        </span>
      </label>

      <div class="actions">
        <button type="submit">Send via WhatsApp</button>
      </div>
    </form>
  </main>

  <script>
    const BUSINESS_WHATSAPP_NUMBER = "919037489654"; // digits only for wa.me
    const consentMessage = "I have read and agree to the Terms and Conditions.";

    const form = document.getElementById("consent-form");
    const consentAgree = document.getElementById("consent-agree");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!consentAgree.checked) {
        alert("Please check the box to confirm you have read and agree to the booking policy.");
        return;
      }

      const data = new FormData(form);
      const name = (data.get("name") || "").trim();
      const phone = (data.get("phone") || "").trim();

      if (!name || !phone) {
        alert("Please fill in at least Name and Phone Number.");
        return;
      }

      const fields = [
        ["NAME", name],
        ["AGE", (data.get("age") || "").trim()],
        ["GENDER", (data.get("gender") || "").trim()],
        ["PHONE NUMBER", phone],
        ["MARITAL STATUS", (data.get("marital") || "").trim()],
        ["FATHER NAME", (data.get("father") || "").trim()],
        ["ADDRESS", (data.get("address") || "").trim()],
        ["EDUCATION QUALIFICATION", (data.get("education") || "").trim()],
        ["FAMILY TYPE", (data.get("family") || "").trim()],
      ];

      const formatted = fields
        .filter(([, value]) => value !== "")
        .map(([label, value]) => `${label}: ${value}`)
        .join("\n");

      const message = `TELE-PSYCHIATRIC CONSENT FORM\n\n${formatted}\n\n${consentMessage}`;
      const encoded = encodeURIComponent(message);
      const url = `https://wa.me/${BUSINESS_WHATSAPP_NUMBER}?text=${encoded}`;

      const opened = window.open(url, "_blank");
      if (!opened) {
        window.location.href = url;
      }
    });
  </script>
</body>
</html>
